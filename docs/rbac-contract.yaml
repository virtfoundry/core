# Kubernetes API access the virtfoundry-api ServiceAccount needs for typed (client-go)
# calls. Single source of truth for two checks:
#
#   1. core:        internal/platform/k8s/rbac_contract_test.go fails when the code calls a
#                   (group, resource, verb) that is not listed here, or lists one it no longer
#                   uses.
#   2. helm-charts: scripts/ci/verify-api-rbac-contract.sh fails when the rendered API
#                   ClusterRole/Roles do not grant `verbs`, or grant a `bestEffortVerbs` entry.
#
# Unit tests use fake clients and cannot see RBAC, so a new call without a matching grant only
# fails at deploy time (core#196 to core#198 came from exactly that).
#
# Not covered: dynamic-client access (virtfoundry.io CRDs, KubeVirt, CDI, Multus), which is
# granted per resource in the chart, and calls made through a stored client variable. These
# accesses are listed under `dynamicClient` below for the chart to grant; rbac_contract_test.go
# does not enforce them (it only AST-scans typed client-go calls).
#
#   scope: cluster     the grant must be in the ClusterRole (tenant namespaces are created at
#                      runtime, so RBAC cannot name them). This is the default.
#   scope: namespaced  a Role in the API namespace is enough.
#   verbs              required: the chart must grant them.
#   bestEffortVerbs    the code calls them but tolerates Forbidden; the chart must NOT grant
#                      them (least privilege, see MAINTAINERS and core#196/#198).
version: 1
rules:
  - apiGroup: ""
    resource: namespaces
    verbs: [get, list, create, delete]
    bestEffortVerbs: [patch]
    note: >-
      patch is the legacy label backfill on existing tenant namespaces. The operator owns
      tenant namespaces, so the API is deliberately not granted it; a legacy namespace is
      labelled by hand (helm-charts docs, operator recovery).
  - apiGroup: ""
    resource: pods
    verbs: [list]
  - apiGroup: ""
    resource: pods/log
    verbs: [get]
  - apiGroup: ""
    resource: services
    verbs: [get, create, update, delete]
  - apiGroup: ""
    resource: endpoints
    verbs: [create, update, delete]
  - apiGroup: ""
    resource: persistentvolumeclaims
    verbs: [list, create, delete]
  - apiGroup: ""
    resource: resourcequotas
    verbs: [get, create]
  - apiGroup: ""
    resource: nodes
    verbs: [list]
  - apiGroup: ""
    resource: secrets
    scope: namespaced
    verbs: [get, create, update, delete]
  - apiGroup: networking.k8s.io
    resource: networkpolicies
    verbs: [get, create, update, delete]
# dynamicClient documents access through the discovery REST client
# (cs.Discovery().RESTClient() / dynamic client) — a pattern used when
# the typed client-go does not expose the group (e.g. metrics.k8s.io
# comes from metrics-server, not from client-go). rbac_contract_test.go
# does not scan these calls, so the chart is the source of truth and
# must grant them. Each entry lists (apiGroup, resource, verbs).
dynamicClient:
  - apiGroup: metrics.k8s.io
    resource: nodes
    verbs: [get, list]
    note: >-
      Tier 2 of the dashboard host metrics spec. Source: KubeVirtDriver.fetchClusterUsage
      (internal/infra/hypervisor/kubevirt.go). Reachable only when metrics-server is
      installed (documented prerequisite in helm-charts). The dashboard degrades gracefully
      when this API is absent, Forbidden, or transiently unavailable.

