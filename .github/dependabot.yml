# One grouped PR per ecosystem per month keeps review requests (CODEOWNERS) and
# email volume low. Security updates are separate and are not delayed by this schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-github-actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-gomod:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-npm:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-docker:
        patterns: ["*"]
