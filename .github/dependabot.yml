# One grouped PR per ecosystem per month keeps review requests (CODEOWNERS) and
# email volume low. Security updates are separate and are not delayed by this schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-github-actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    # The k8s.io libraries must move together with kubevirt.io/client-go (it is built
    # against one k8s minor). Bumping one of them alone breaks the build, so only
    # patch updates come from here; minor bumps follow a KubeVirt client upgrade.
    ignore:
      - dependency-name: "k8s.io/api"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "k8s.io/apimachinery"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "k8s.io/client-go"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "k8s.io/apiextensions-apiserver"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      all-gomod:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    # Majors (React, react-router, Tailwind, Vite, recharts...) are migrations, not
    # bumps: they come as separate PRs. Only minor and patch updates are grouped.
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: "/docker"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      all-docker:
        patterns: ["*"]
