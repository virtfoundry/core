name: Build and push images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/virtfoundry/core
  UI_IMAGE: ghcr.io/virtfoundry/ui
  ARGO_HOMELAB_REPO: Matheus-Thurler/argo-homelab
  ARGO_VALUES_PATH: platform/virtfoundry/values-homelab.yaml

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker metadata (UI)
        id: meta-ui
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.UI_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{ is_default_branch }}

      - name: Build and push API
        id: build-api
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          # Homelab containerd 2.x fails CreateContainer on attestation OCI indexes.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push UI
        id: build-ui
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/Dockerfile.ui
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pin digests in argo-homelab so Argo CD sees a Git change and rolls pods.
      # Requires repo secret ARGO_HOMELAB_TOKEN (contents:write on Matheus-Thurler/argo-homelab).
      - name: Pin image digests in argo-homelab
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          ARGO_HOMELAB_TOKEN: ${{ secrets.ARGO_HOMELAB_TOKEN }}
          API_DIGEST: ${{ steps.build-api.outputs.digest }}
          UI_DIGEST: ${{ steps.build-ui.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${ARGO_HOMELAB_TOKEN:-}" ]; then
            echo "::error::Missing secret ARGO_HOMELAB_TOKEN (PAT with contents:write on ${ARGO_HOMELAB_REPO}). Argo will not pick up new image digests."
            exit 1
          fi
          if [ -z "${API_DIGEST:-}" ] || [ -z "${UI_DIGEST:-}" ]; then
            echo "::error::Missing image digests from build-push (api='${API_DIGEST:-}' ui='${UI_DIGEST:-}')"
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA:0:7}"
          WORKDIR="${RUNNER_TEMP}/argo-homelab"
          # Basic x-access-token works for classic PAT, fine-grained PAT, and OAuth
          # tokens. Bearer alone often falls through to interactive username prompt
          # ("could not read Username for 'https://github.com'").
          # Keep the token out of the remote URL (process-list / git-remote leaks).
          BASIC_AUTH="$(printf 'x-access-token:%s' "${ARGO_HOMELAB_TOKEN}" | base64 | tr -d '\n')"
          git -c http.extraHeader="Authorization: Basic ${BASIC_AUTH}" \
            clone --depth 1 "https://github.com/${ARGO_HOMELAB_REPO}.git" "$WORKDIR" \
            || {
              echo "::error::Clone of ${ARGO_HOMELAB_REPO} failed. Rotate ARGO_HOMELAB_TOKEN (contents:write on that repo)."
              exit 1
            }
          cd "$WORKDIR"
          git config user.name "virtfoundry-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local http.https://github.com/.extraheader "Authorization: Basic ${BASIC_AUTH}"

          VALUES="$ARGO_VALUES_PATH"
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path(os.environ["ARGO_VALUES_PATH"])
          text = path.read_text()
          api = os.environ["API_IMAGE"] + "@" + os.environ["API_DIGEST"]
          ui = os.environ["UI_IMAGE"] + "@" + os.environ["UI_DIGEST"]
          # Replace images.api / worker / ui lines under images: block.
          def sub_image(key: str, value: str, src: str) -> str:
              return re.sub(
                  rf"(?m)^(\s*{key}:\s*).+$",
                  rf"\1{value}",
                  src,
                  count=1,
              )
          out = text
          out = sub_image("api", api, out)
          out = sub_image("ui", ui, out)
          out = re.sub(r"(?m)^(\s*pullPolicy:\s*).+$", r"\1IfNotPresent", out, count=1)
          if out == text:
              raise SystemExit("values file unchanged — check images.api/ui keys exist")
          path.write_text(out)
          print(f"pinned api -> {api}")
          print(f"pinned ui -> {ui}")
          PY

          git add "$VALUES"
          if git diff --cached --quiet; then
            echo "No digest change; skipping commit"
            exit 0
          fi
          git commit -m "chore(virtfoundry): pin images to ${SHORT_SHA}"
          git push origin HEAD:main

      # Keyless signatures are separate OCI artifacts (<digest>.sig tags): they do not change
      # the image, so the homelab containerd is unaffected. Placed after the Argo pin so a
      # signing failure can never block a rollout.
      - name: Install Cosign
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2

      - name: Sign API image (keyless)
        if: ${{ !cancelled() && steps.build-api.outputs.digest != '' && github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build-api.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${API_IMAGE}@${DIGEST}"

      - name: Sign UI image (keyless)
        if: ${{ !cancelled() && steps.build-ui.outputs.digest != '' && github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build-ui.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${UI_IMAGE}@${DIGEST}"
