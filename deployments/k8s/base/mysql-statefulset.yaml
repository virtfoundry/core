apiVersion: v1
kind: Secret
metadata:
  name: nimbus-mysql-secret
  namespace: nimbus-system
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "nimbus-root"
  MYSQL_DATABASE: "nimbus"
  MYSQL_USER: "nimbus"
  MYSQL_PASSWORD: "nimbus"
---
apiVersion: v1
kind: Service
metadata:
  name: nimbus-mysql
  namespace: nimbus-system
  labels:
    app: nimbus-mysql
spec:
  ports:
    - port: 3306
      name: mysql
  clusterIP: None
  selector:
    app: nimbus-mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nimbus-mysql
  namespace: nimbus-system
  labels:
    app: nimbus-mysql
spec:
  serviceName: nimbus-mysql
  replicas: 1
  selector:
    matchLabels:
      app: nimbus-mysql
  template:
    metadata:
      labels:
        app: nimbus-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nimbus-mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: nimbus-mysql-secret
                  key: MYSQL_DATABASE
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: nimbus-mysql-secret
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nimbus-mysql-secret
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 30
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
