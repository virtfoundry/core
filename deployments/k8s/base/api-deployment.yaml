apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimbus-api
  namespace: nimbus-system
  labels:
    app: nimbus-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nimbus-api
  template:
    metadata:
      labels:
        app: nimbus-api
    spec:
      serviceAccountName: nimbus-api
      containers:
        - name: api
          image: nimbus/iaas-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: CONFIG_PATH
              value: /etc/nimbus/config.yaml
            - name: ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nimbus-secrets
                  key: ROOT_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nimbus-secrets
                  key: JWT_SECRET
          volumeMounts:
            - name: config
              mountPath: /etc/nimbus
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: nimbus-config
---
apiVersion: v1
kind: Service
metadata:
  name: nimbus-api
  namespace: nimbus-system
spec:
  selector:
    app: nimbus-api
  ports:
    - port: 8080
      targetPort: 8080
      name: http
