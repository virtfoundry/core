apiVersion: apps/v1
kind: Deployment
metadata:
  name: nimbus-ui
  namespace: nimbus-system
  labels:
    app: nimbus-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nimbus-ui
  template:
    metadata:
      labels:
        app: nimbus-ui
    spec:
      containers:
        - name: ui
          image: nimbus/iaas-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nimbus-ui
  namespace: nimbus-system
spec:
  selector:
    app: nimbus-ui
  ports:
    - port: 80
      targetPort: 80
      name: http
