# One-shot pod to import images into node containerd (single-node homelab).
apiVersion: v1
kind: Pod
metadata:
  name: nimbus-image-import
  namespace: nimbus-system
  labels:
    app: nimbus-image-import
spec:
  nodeName: mgmt-01
  restartPolicy: Never
  hostPID: true
  containers:
    - name: import
      image: alpine:3.20
      command: ["sleep", "7200"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: host
          mountPath: /host
        - name: import
          mountPath: /import
  volumes:
    - name: host
      hostPath:
        path: /
        type: Directory
    - name: import
      emptyDir:
        sizeLimit: 2Gi
